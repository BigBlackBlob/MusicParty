services:
  # 1. 网易云音乐 API 服务
  netease-api:
    image: ${NETEASE_API_IMAGE:?set a pinned NetEase API image tag in .env}
    container_name: music-party-netease
    restart: always
    environment:
      - PORT=3000
      - HTTPS=true
    networks:
      - music-net

  # 2. Music Party 主应用
  music-party:
    # VPS 部署默认从 GHCR 拉取 NRT-Base 分支镜像；如需走阿里云 ACR，可改为：
    # ${MUSIC_PARTY_IMAGE:-crpi-533x5q1t88ew0x21.cn-hangzhou.personal.cr.aliyuncs.com/nrt-base/nrt-music-party:latest}
    image: ${MUSIC_PARTY_IMAGE:-ghcr.io/bigblackblob/musicparty:nrt-base}
    pull_policy: ${MUSIC_PARTY_PULL_POLICY:-missing}
    container_name: music-party-app
    restart: always
    ports:
      - "8848:8080" 
    environment:
      # [必填] 网易云 API 地址，指向上面的容器名
      - NETEASE_API_URL=http://netease-api:3000
      
      # [基础配置]
      - BASE_URL=http://localhost:8848    #你的基础url，用于直播流链接的拼接
      - ALLOWED_ORIGINS=http://localhost:8848 # 逗号分隔；生产环境填写实际访问 Origin
      # Set these in the untracked .env file before the first production start.
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:?set in .env before first start}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?set in .env before first start}
      - APP_AUTHOR_NAME=ThorNex      # 页面左上角显示的作者名
      - APP_BACK_WORDS=MUSIC PARTY    # 中间背景装饰文字
      
      # [可选迁移] 平台凭证。新版建议在设置页保存到数据库持久化配置。
      - BILIBILI_SESSDATA=""         # B站 SESSDATA
      - NETEASE_COOKIE=""            # 网易云 Cookie
      - NETEASE_QUALITY=exhigh       # 网易云音质 (standard, higher, exhigh, lossless, hires)
      # [可选] YouTube 搜索/点歌；需要 YouTube Data API Key，镜像内默认提供 yt-dlp
      - YOUTUBE_ENABLED=true
      - YOUTUBE_API_KEY=
      - YTDLP_PATH=yt-dlp
      - YOUTUBE_SEARCH_LIMIT=20
      # [可选] Navidrome 私有曲库；默认不启用，启用请配合 docker-compose.navidrome.yml
      # - NAVIDROME_ENABLED=false
      # - NAVIDROME_BASE_URL=http://navidrome:4533
      # - NAVIDROME_USERNAME=
      # - NAVIDROME_PASSWORD=
      # - NAVIDROME_ALLOWED_USERS=Nirotiy,Alice

      # [性能/策略配置]
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:+UseG1GC -Dreactor.schedulers.defaultBoundedElasticSize=64
      - QUEUE_MAX_SIZE=1000          # 播放队列最大长度
      - QUEUE_HISTORY_SIZE=50        # 历史记录保留数量
      - PLAYLIST_IMPORT_LIMIT=100    # 导入歌单时的最大歌曲数限制
      - CHAT_HISTORY_LIMIT=1000      # 聊天历史记录保留数量
      - CACHE_MAX_SIZE=1GB           # 本地音乐缓存上限 (例如 512MB, 1GB, 2GB)
      - STREAM_MAX_LISTENERS=50      # HTTP 直播最大监听连接数
      - STREAM_CLIENT_QUEUE_CAPACITY=32 # 单个直播客户端待发送音频块队列容量
      - STREAM_WRITER_THREADS=8      # 直播客户端写出线程数
      - DOWNLOAD_MAX_QUEUED_TASKS=100 # YouTube/远程缓存下载最大排队数
      - DOWNLOAD_TASK_TTL_MS=1800000 # 失败或长期挂起下载任务保留时间
      - COVER_COLOR_CACHE_SIZE=256   # 封面取色 URL 结果缓存数量
      - COVER_COLOR_MAX_CONCURRENT=4 # 封面下载/解码最大并发数
      # [本地上传曲库]
      - LOCAL_LIBRARY_ENABLED=true
      - LOCAL_LIBRARY_PATH=data/local-library
      - LOCAL_LIBRARY_ALLOWED_USERS= # 管理员始终可上传；非管理员白名单可在设置页维护
      - LOCAL_LIBRARY_MAX_UPLOAD_BYTES=209715200
      - LOCAL_LIBRARY_MAX_EMBEDDED_COVER_BYTES=1048576
      - MULTIPART_MAX_FILE_SIZE=200MB
      - MULTIPART_MAX_REQUEST_SIZE=220MB

      # [防滥用配置]
      - QUEUE_MAX_USER_SONGS=100     # 单用户最大点歌数
      - CHAT_MIN_INTERVAL=1000       # 聊天间隔 (毫秒)
      - CHAT_MAX_LENGTH=200          # 聊天最大长度
      - AUTH_RATE_LIMIT_ENABLED=true # 是否开启密码限流
      - AUTH_MAX_ATTEMPTS=5          # 密码最大尝试次数
      - AUTH_WINDOW_SECONDS=60       # 密码尝试窗口 (秒)
      - AUTH_BLOCK_DURATION=300      # 密码封锁时间 (秒)

    depends_on:
      - netease-api
    networks:
      - music-net
    volumes:
      # 挂载音频缓存目录，防止重启后 B 站歌曲重新下载
      - ./music_party/cached_media:/app/cached_media
      # 挂载数据目录，用于持久化播放列表和历史记录
      # 本地上传曲库默认也保存在 ./music_party/data/local-library
      - ./music_party/data:/app/data

networks:
  music-net:
    driver: bridge
