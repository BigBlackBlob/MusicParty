services:
  music-party:
    # MUSIC_PARTY_IMAGE must be an immutable Go image digest.
    image: ${MUSIC_PARTY_IMAGE:?set MUSIC_PARTY_IMAGE to the Go image digest}
    environment:
      - APP_MODE=server
      - DB_PATH=/app/data/musicparty.db
      # The first production cutover must validate the frozen Java schema only.
      - DB_INIT_SCHEMA=false
      - STATIC_PATH=/app/static
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
