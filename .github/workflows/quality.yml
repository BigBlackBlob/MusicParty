name: Quality

on:
  pull_request:
  push:
    branches: [ "main", "master", "NRT-Base" ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: chmod +x ./mvnw && ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-party-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: music-party-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Lint frontend
        run: pnpm lint
      - name: Test frontend
        run: pnpm test:run
      - name: Build frontend
        run: pnpm build
