name: Go Backend

on:
  pull_request:
    paths:
      - 'backend-go/**'
      - 'contracts/**'
      - 'music-party-web/**'
      - 'src/main/java/**'
      - 'src/main/resources/application.yml'
      - '.dockerignore'
      - '.github/workflows/go-backend.yml'
  push:
    branches: [ 'main', 'master', 'NRT-Base' ]
    paths:
      - 'backend-go/**'
      - 'contracts/**'
      - 'music-party-web/**'
      - 'src/main/java/**'
      - 'src/main/resources/application.yml'
      - '.dockerignore'
      - '.github/workflows/go-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend-go
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Verify generated contracts
        run: go run ./cmd/contractgen -check -repo ..
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Unit and process integration tests
        run: go test -count=1 ./...
      - name: Native build
        run: go build -trimpath ./...

  race-and-vulnerability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - name: Race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: CGO-free Linux build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-go/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: musicparty-go-ci:${{ github.sha }}
          cache-from: type=gha,scope=musicparty-go
          cache-to: type=gha,mode=max,scope=musicparty-go
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: musicparty-go-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
