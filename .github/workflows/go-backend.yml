name: Go Backend

on:
  pull_request:
    paths:
      - 'backend-go/**'
      - 'contracts/**'
      - 'music-party-web/**'
      - 'src/main/java/**'
      - 'src/main/resources/application.yml'
      - '.dockerignore'
      - '.github/workflows/go-backend.yml'
  push:
    branches: [ 'main', 'master', 'NRT-Base' ]
    paths:
      - 'backend-go/**'
      - 'contracts/**'
      - 'music-party-web/**'
      - 'src/main/java/**'
      - 'src/main/resources/application.yml'
      - '.dockerignore'
      - '.github/workflows/go-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend-go
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Verify generated contracts
        run: go run ./cmd/contractgen -check -repo ..
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Unit and process integration tests
        run: go test -count=1 ./...
      - name: Native build
        run: go build -trimpath ./...

  race-and-vulnerability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - name: Race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: CGO-free Linux build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath ./...

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - name: Generate coverage profile
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Print coverage summary
        run: go tool cover -func=coverage.out
      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend-go/coverage.out
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: music-party-web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: music-party-web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: music-party-web
        run: pnpm exec playwright install --with-deps chromium
      - name: Install local media transcoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build frontend
        working-directory: music-party-web
        run: pnpm build
      - name: Build backend
        working-directory: backend-go
        run: go build -trimpath -o "$RUNNER_TEMP/musicparty" ./cmd/musicparty
      - name: Start test server
        env:
          SERVER_PORT: '18081'
          APP_MODE: server
          BASE_URL: http://127.0.0.1:18081
          ALLOWED_ORIGINS: http://127.0.0.1:18081
          DB_ENABLED: 'true'
          DB_INIT_SCHEMA: 'true'
          BOOTSTRAP_ADMIN_USERNAME: e2e-admin
          BOOTSTRAP_ADMIN_PASSWORD: E2E-Password-2026!
          AUTH_SECURE_COOKIES: 'false'
          AUTH_RATE_LIMIT_ENABLED: 'false'
          ROOM_ACCESS_TOKEN_SECRET: e2e-room-access-secret-32-bytes
          NETEASE_API_URL: http://127.0.0.1:9
          YOUTUBE_ENABLED: 'false'
          NAVIDROME_ENABLED: 'false'
          SQUIDIFY_ENABLED: 'false'
        run: |
          export DB_PATH="$RUNNER_TEMP/musicparty-e2e.db"
          export LOCAL_LIBRARY_PATH="$RUNNER_TEMP/musicparty-e2e-local"
          export STATIC_PATH="$GITHUB_WORKSPACE/music-party-web/dist"
          "$RUNNER_TEMP/musicparty" >"$RUNNER_TEMP/musicparty-e2e.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/musicparty-e2e.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/musicparty-e2e.log"
          exit 1
      - name: Run core browser flows
        working-directory: music-party-web
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: pnpm test:e2e
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            music-party-web/playwright-report
            music-party-web/test-results
          if-no-files-found: ignore
      - name: Stop test server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/musicparty-e2e.pid"; then
            kill "$(cat "$RUNNER_TEMP/musicparty-e2e.pid")" || true
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-go/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: musicparty-go-ci:${{ github.sha }}
          cache-from: type=gha,scope=musicparty-go
          cache-to: type=gha,mode=max,scope=musicparty-go
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: musicparty-go-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
