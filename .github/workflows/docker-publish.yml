name: Publish Legacy Java Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable legacy Java image tag, prefixed with java-legacy-
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bigblackblob/musicparty

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: |
          chmod +x ./mvnw
          ./mvnw test

      - name: Validate immutable legacy tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^java-legacy-[a-z0-9][a-z0-9._-]{0,115}$ ]]; then
            echo "image_tag must start with java-legacy- and contain only lowercase tag characters" >&2
            exit 1
          fi

      # 设置 QEMU 和 Docker Buildx 以支持多架构构建 (可选，此处仅作为标准配置)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到镜像仓库
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject reused legacy tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "legacy image tag already exists: $image" >&2
            exit 1
          fi

      # 提取元数据 (tags, labels)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=sha-,format=short

      # 构建并推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
