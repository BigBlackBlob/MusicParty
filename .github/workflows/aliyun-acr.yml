name: Publish Legacy Java Image to Aliyun ACR (Legacy Only)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable legacy Java image tag, prefixed with java-legacy-
        required: true
        type: string

env:
  IMAGE_NAME: nrt-music-party
  NAMESPACE: nrt-base
  REGISTRY: crpi-533x5q1t88ew0x21.cn-hangzhou.personal.cr.aliyuncs.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate immutable legacy tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^java-legacy-[a-z0-9][a-z0-9._-]{0,115}$ ]]; then
            echo "image_tag must start with java-legacy- and contain only lowercase tag characters" >&2
            exit 1
          fi

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME || secrets.ALIYUN_ACCESS_KEY_ID }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD || secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Reject reused legacy tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "legacy image tag already exists: $image" >&2
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
