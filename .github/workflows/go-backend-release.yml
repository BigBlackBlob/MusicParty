name: Publish Go Backend Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release label, for example go-v0.9.0-rc1
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: music-party-web/pnpm-lock.yaml
      - name: Require the frozen baseline or NRT-Base
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != go-* ]]; then
            echo "Release tags must start with go-" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" != "NRT-Base" ]]; then
            echo "Manual candidates may only be published from NRT-Base or a go-* tag" >&2
            exit 1
          fi
      - name: Verify Java baseline
        run: ./mvnw -q test
      - name: Verify frontend
        working-directory: music-party-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test:run
          pnpm lint
          pnpm build
      - name: Verify Go and frozen contracts
        working-directory: backend-go
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go run ./cmd/contractgen -check -repo ..
          go vet ./...
          go test -count=1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/musicparty-go
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha
      - name: Build candidate for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-go/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: musicparty-go-release-scan:${{ github.sha }}
          cache-from: type=gha,scope=musicparty-go-release
          cache-to: type=gha,mode=max,scope=musicparty-go-release
      - name: Scan candidate for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: musicparty-go-release-scan:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Publish verified immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-go/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=musicparty-go-release
          cache-to: type=gha,mode=max,scope=musicparty-go-release
      - name: Record deployable digest
        run: echo "MUSIC_PARTY_IMAGE=ghcr.io/${{ github.repository_owner }}/musicparty-go@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
