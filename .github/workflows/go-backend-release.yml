name: Publish Go Backend Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release label, for example go-v0.9.0-rc1
        required: true
        type: string
      acceptance_manifest:
        description: Committed Stage 8/9 manifest for this candidate
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ALIYUN_ACR_REGISTRY: crpi-533x5q1t88ew0x21.cn-hangzhou.personal.cr.aliyuncs.com
  ALIYUN_ACR_NAMESPACE: nrt-base
  ALIYUN_ACR_IMAGE: nrt-music-party

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.acceptance.outputs.candidate_sha }}
      acceptance_manifest: ${{ inputs.acceptance_manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend-go/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: music-party-web/pnpm-lock.yaml
      - name: Validate release ref, baseline, and acceptance evidence
        id: acceptance
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ACCEPTANCE_MANIFEST: ${{ inputs.acceptance_manifest }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^go-v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "version must match go-vMAJOR.MINOR.PATCH or go-vMAJOR.MINOR.PATCH-rcN" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$RELEASE_VERSION" ]]; then
            echo "a release tag must equal the requested immutable version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" != "NRT-Base" ]]; then
            echo "manual candidates may only be published from NRT-Base or a matching go-* tag" >&2
            exit 1
          fi
          git merge-base --is-ancestor go-rewrite-baseline-v1 "$GITHUB_SHA" || {
            echo "release commit is not based on go-rewrite-baseline-v1" >&2
            exit 1
          }
          case "$ACCEPTANCE_MANIFEST" in
            backend-go/acceptance/stage8/*/manifest.json|backend-go/acceptance/stage9/*/manifest.json) ;;
            *) echo "acceptance_manifest must be under backend-go/acceptance/stage8 or stage9" >&2; exit 1 ;;
          esac
          test -f "$ACCEPTANCE_MANIFEST" || { echo "acceptance manifest not found" >&2; exit 1; }
          python - "$ACCEPTANCE_MANIFEST" "$GITHUB_SHA" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1]).resolve()
          root = Path.cwd().resolve()
          try:
              manifest_path.relative_to(root)
          except ValueError:
              raise SystemExit("acceptance manifest escapes the repository")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          candidate = data.get("candidateSha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("acceptance manifest candidateSha must be a full commit SHA")
          if not str(data.get("result", "")).startswith("PASS"):
              raise SystemExit("acceptance manifest is not a passing result")
          for key in ("containsCredentials", "containsDatabase", "containsExecutables"):
              if data.get(key) is True:
                  raise SystemExit(f"acceptance manifest contains forbidden material: {key}")
          subprocess.run(["git", "merge-base", "--is-ancestor", candidate, sys.argv[2]], check=True)
          changed = subprocess.check_output(["git", "diff", "--name-only", f"{candidate}..{sys.argv[2]}"], text=True).splitlines()
          allowed = ("backend-go/acceptance/", "docs/")
          unexpected = [path for path in changed if not path.startswith(allowed)]
          if unexpected:
              raise SystemExit("release ref changed source after acceptance: " + ", ".join(unexpected))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_sha={candidate}\n")
          print(f"accepted candidate: {candidate}")
          print(f"manifest: {manifest_path.relative_to(root)}")
          print(f"post-acceptance files: {len(changed)}")
          PY
      - name: Verify Java baseline
        run: ./mvnw -q test
      - name: Verify frontend
        working-directory: music-party-web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:run
          pnpm lint
          pnpm build
      - name: Verify Go and frozen contracts
        working-directory: backend-go
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go run ./cmd/contractgen -check -repo ..
          go vet ./...
          go test -count=1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Upload acceptance manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage9-acceptance-${{ github.sha }}
          path: ${{ inputs.acceptance_manifest }}
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME || secrets.ALIYUN_ACCESS_KEY_ID }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD || secrets.ALIYUN_ACCESS_KEY_SECRET }}
      - name: Reject reused release label
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for image in \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/musicparty-go:${RELEASE_VERSION}" \
            "${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/${ALIYUN_ACR_IMAGE}:${RELEASE_VERSION}"; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "release label already exists: $image" >&2
              exit 1
            fi
          done
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/musicparty-go
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_NAMESPACE }}/${{ env.ALIYUN_ACR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha
      - name: Build candidate for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-go/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: musicparty-go-release-scan:${{ github.sha }}
          cache-from: type=gha,scope=musicparty-go-release
          cache-to: type=gha,mode=max,scope=musicparty-go-release
      - name: Scan candidate for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: musicparty-go-release-scan:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Publish verified immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-go/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=musicparty-go-release
          cache-to: type=gha,mode=max,scope=musicparty-go-release
      - name: Record deployable digest
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          ACCEPTANCE_MANIFEST: ${{ needs.verify.outputs.acceptance_manifest }}
        run: |
          {
            echo "MUSIC_PARTY_IMAGE=ghcr.io/${{ github.repository_owner }}/musicparty-go@${{ steps.build.outputs.digest }}"
            echo "ACR_MUSIC_PARTY_IMAGE=${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_NAMESPACE }}/${{ env.ALIYUN_ACR_IMAGE }}@${{ steps.build.outputs.digest }}"
            echo "accepted_candidate_sha=${CANDIDATE_SHA}"
            echo "acceptance_manifest=${ACCEPTANCE_MANIFEST}"
            echo "release_commit=${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
