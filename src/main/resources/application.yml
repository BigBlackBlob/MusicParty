server:
  port: 8080

management:
  metrics:
    distribution:
      percentiles-histogram:
        musicparty.queue.ack.latency: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  main:
    web-application-type: reactive
  webflux:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:220MB}

# Logging configuration
logging:
  level:
    # Set the root logger to INFO
    root: INFO
    # Production defaults to INFO; set LOG_LEVEL=DEBUG temporarily when diagnosing an incident.
    org.thornex.musicparty: ${LOG_LEVEL:INFO}

# Custom application properties
app:
  music-api:
    admin-password: ${ADMIN_PASSWORD:}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    mode: ${APP_MODE:server}
    base-url: ${BASE_URL:http://localhost:8080}
    allowed-origins: ${ALLOWED_ORIGINS:}
    author-name: ${APP_AUTHOR_NAME:ThorNex}
    back-words: ${APP_BACK_WORDS:THORNEX}
    netease:
      # The base URL of your deployed NeteaseCloudMusicApi instance
      base-url: ${NETEASE_API_URL:http://netease-api:3000}
      cookie: ${NETEASE_COOKIE:}
      quality: ${NETEASE_QUALITY:exhigh}
    bilibili:
      # Bilibili API base URL, it's public
      base-url: "https://api.bilibili.com"
      sessdata: ${BILIBILI_SESSDATA:}
    youtube:
      enabled: ${YOUTUBE_ENABLED:true}
      api-key: ${YOUTUBE_API_KEY:}
      yt-dlp-path: ${YTDLP_PATH:yt-dlp}
      max-results: ${YOUTUBE_SEARCH_LIMIT:20}
    navidrome:
      enabled: ${NAVIDROME_ENABLED:false}
      base-url: ${NAVIDROME_BASE_URL:http://navidrome:4533}
      username: ${NAVIDROME_USERNAME:}
      password: ${NAVIDROME_PASSWORD:}
      client: ${NAVIDROME_CLIENT:musicparty}
      api-version: ${NAVIDROME_API_VERSION:1.16.1}
      allowed-users: ${NAVIDROME_ALLOWED_USERS:}
    squidify:
      enabled: ${SQUIDIFY_ENABLED:true}
      id: ${SQUIDIFY_ID:squidify}
      label: ${SQUIDIFY_LABEL:Squidify}
      base-url: ${SQUIDIFY_BASE_URL:}
      username: ${SQUIDIFY_USERNAME:}
      password: ${SQUIDIFY_PASSWORD:}
      client: ${SQUIDIFY_CLIENT:musicparty}
      api-version: ${SQUIDIFY_API_VERSION:1.16.1}
      allowed-users: ${SQUIDIFY_ALLOWED_USERS:*}
    queue:
      max-size: ${QUEUE_MAX_SIZE:1000}
      history-size: ${QUEUE_HISTORY_SIZE:50}
      max-user-songs: ${QUEUE_MAX_USER_SONGS:100}
    player:
      max-playlist-import-size: ${PLAYLIST_IMPORT_LIMIT:100}
      room-eviction-idle-ms: ${ROOM_EVICTION_IDLE_MS:3600000}
    chat:
      max-history-size: ${CHAT_HISTORY_LIMIT:1000}
      min-interval-ms: ${CHAT_MIN_INTERVAL:1000}
      max-message-length: ${CHAT_MAX_LENGTH:200}
    cache:
      max-size: ${CACHE_MAX_SIZE:1GB}
    performance:
      stream-max-listeners: ${STREAM_MAX_LISTENERS:50}
      stream-client-queue-capacity: ${STREAM_CLIENT_QUEUE_CAPACITY:32}
      stream-writer-threads: ${STREAM_WRITER_THREADS:8}
      download-max-queued-tasks: ${DOWNLOAD_MAX_QUEUED_TASKS:100}
      download-max-active-tasks: ${DOWNLOAD_MAX_ACTIVE_TASKS:3}
      download-reservation-bytes: ${DOWNLOAD_RESERVATION_BYTES:33554432}
      netease-download-concurrency: ${NETEASE_DOWNLOAD_CONCURRENCY:2}
      bilibili-download-concurrency: ${BILIBILI_DOWNLOAD_CONCURRENCY:1}
      youtube-download-concurrency: ${YOUTUBE_DOWNLOAD_CONCURRENCY:1}
      local-download-concurrency: ${LOCAL_DOWNLOAD_CONCURRENCY:2}
      download-task-ttl-ms: ${DOWNLOAD_TASK_TTL_MS:1800000}
      download-max-retries: ${DOWNLOAD_MAX_RETRIES:3}
      download-retry-initial-delay-ms: ${DOWNLOAD_RETRY_INITIAL_DELAY_MS:1000}
      download-retry-max-delay-ms: ${DOWNLOAD_RETRY_MAX_DELAY_MS:30000}
      cover-color-cache-size: ${COVER_COLOR_CACHE_SIZE:256}
      cover-color-max-concurrent: ${COVER_COLOR_MAX_CONCURRENT:4}
      websocket-client-queue-capacity: ${WEBSOCKET_CLIENT_QUEUE_CAPACITY:256}
      room-command-queue-capacity: ${ROOM_COMMAND_QUEUE_CAPACITY:100}
      room-command-queue-timeout-ms: ${ROOM_COMMAND_QUEUE_TIMEOUT_MS:5000}
      db-write-queue-capacity: ${DB_WRITE_QUEUE_CAPACITY:100}
      db-read-threads: ${DB_READ_THREADS:2}
      db-read-queue-capacity: ${DB_READ_QUEUE_CAPACITY:512}
      file-io-threads: ${FILE_IO_THREADS:4}
      file-io-queue-capacity: ${FILE_IO_QUEUE_CAPACITY:200}
      subprocess-threads: ${SUBPROCESS_THREADS:2}
      subprocess-queue-capacity: ${SUBPROCESS_QUEUE_CAPACITY:20}
      image-cpu-threads: ${IMAGE_CPU_THREADS:2}
      image-cpu-queue-capacity: ${IMAGE_CPU_QUEUE_CAPACITY:100}
      upstream-max-concurrent: ${UPSTREAM_MAX_CONCURRENT:4}
      upstream-failure-threshold: ${UPSTREAM_FAILURE_THRESHOLD:5}
      upstream-circuit-open-ms: ${UPSTREAM_CIRCUIT_OPEN_MS:30000}
      web-client-max-connections: ${WEB_CLIENT_MAX_CONNECTIONS:20}
      web-client-pending-acquire-max: ${WEB_CLIENT_PENDING_ACQUIRE_MAX:50}
      web-client-pending-acquire-timeout-ms: ${WEB_CLIENT_PENDING_ACQUIRE_TIMEOUT_MS:5000}
    desktop:
      profile-dir: ${MUSICPARTY_PROFILE_DIR:data/desktop-profile}
      lan-base-url: ${DESKTOP_LAN_BASE_URL:}
      netease-api-port: ${DESKTOP_NETEASE_API_PORT:3000}
      admin-initialized: ${DESKTOP_ADMIN_INITIALIZED:false}
    local-library:
      enabled: ${LOCAL_LIBRARY_ENABLED:true}
      path: ${LOCAL_LIBRARY_PATH:data/local-library}
      allowed-users: ${LOCAL_LIBRARY_ALLOWED_USERS:}
      max-upload-bytes: ${LOCAL_LIBRARY_MAX_UPLOAD_BYTES:209715200}
      max-embedded-cover-bytes: ${LOCAL_LIBRARY_MAX_EMBEDDED_COVER_BYTES:1048576}
    database:
      enabled: ${DB_ENABLED:true}
      path: ${DB_PATH:data/musicparty.db}
      init-schema: ${DB_INIT_SCHEMA:true}
      max-pool-size: ${DB_MAX_POOL_SIZE:1}
      min-idle: ${DB_MIN_IDLE:1}
      connection-timeout-ms: ${DB_CONNECTION_TIMEOUT_MS:5000}
      busy-timeout-ms: ${SQLITE_BUSY_TIMEOUT_MS:5000}
    auth:
      rate-limit-enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-attempts: ${AUTH_MAX_ATTEMPTS:5}
      window-seconds: ${AUTH_WINDOW_SECONDS:60}
      block-duration-seconds: ${AUTH_BLOCK_DURATION:300}
      max-tracked-ips: ${AUTH_MAX_TRACKED_IPS:10000}
      trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
      room-access-token-ttl-ms: ${ROOM_ACCESS_TOKEN_TTL_MS:300000}
      room-access-token-secret: ${ROOM_ACCESS_TOKEN_SECRET:}
      secure-cookies: ${AUTH_SECURE_COOKIES:true}
